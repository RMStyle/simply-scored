name: simply_scored
description: "Track your game scores easily."
publish_to: 'none'
version: 0.1.11+11

environment:
  sdk: ^3.10.4

dependencies:
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_picker: ^12.0.0-beta.7
  shared_preferences: ^2.5.3
  decimal: ^3.2.4
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  golden_screenshot: ^11.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows: